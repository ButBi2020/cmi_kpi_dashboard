<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f3ef;--sf:#fff;--sf2:#eeede8;--sf3:#e5e4de;
  --bd:#dddcd5;--bd2:#c8c7bf;
  --tx:#1a1a17;--mu:#68675f;--hi:#a0a099;
  --bl:#1255a0;--bl-bg:#e7f0fb;--bl-lt:#c4d8f4;
  --gn:#0b6b4e;--gn-bg:#dff3ec;
  --am:#7a4a08;--am-bg:#faebd5;
  --rd:#9c2828;--rd-bg:#fbe9e9;

}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:13px;background:var(--bg);color:var(--tx);min-height:100vh;overflow:hidden}
input,button,select,textarea{font-family:inherit;font-size:13px}
button{cursor:pointer}
.hidden{display:none!important}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}

/* LOGIN */
#pg-login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.lcard{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);padding:36px;width:340px}
.lbrand{font-size:22px;font-weight:700;margin-bottom:3px}
.lsub{color:var(--mu);font-size:12px;margin-bottom:26px}
.lf{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.lf label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--mu)}
.lf input{padding:9px 11px;border:1px solid var(--bd);border-radius:var(--r);
  background:var(--sf);color:var(--tx);font-size:14px}
.lf input:focus{outline:none;border-color:var(--bl);box-shadow:0 0 0 3px rgba(18,85,160,.1)}
#btn-login{width:100%;padding:10px;background:var(--bl);color:#fff;border:none;
  border-radius:var(--r);font-size:14px;font-weight:600;margin-top:4px}
#btn-login:hover{opacity:.88}
#l-err{color:var(--rd);font-size:12px;margin-top:8px;padding:7px 10px;
  background:var(--rd-bg);border-radius:var(--r);display:none}

/* TOPBAR */
.topbar{height:var(--th);background:var(--sf);border-bottom:1px solid var(--bd);
  display:flex;align-items:center;justify-content:space-between;padding:0 18px;
  position:fixed;top:0;left:0;right:0;z-index:100}
.tlogo{font-weight:700;font-size:14px}
.tlogo span{color:var(--mu);font-weight:400}
.tright{display:flex;align-items:center;gap:10px}
.tbadge{font-size:11px;font-weight:600;padding:2px 9px;border-radius:12px}
.tba{background:var(--bl-bg);color:var(--bl)}.tbm{background:var(--am-bg);color:var(--am)}
.tav{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:700}
#btn-logout{padding:5px 11px;border-radius:var(--r);border:1px solid var(--bd2);
  background:transparent;color:var(--mu);font-size:11px}
#btn-logout:hover{background:var(--sf2);color:var(--tx)}
/* FIX 2: Live badge opacity */
.sync-badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;cursor:pointer;opacity:0.6}
.sync-badge:hover{opacity:1}
.sync-ok{background:var(--gn-bg);color:var(--gn)}
.sync-loading{background:var(--am-bg);color:var(--am)}
.sync-err{background:var(--rd-bg);color:var(--rd)}

/* SHELL */

.shell{display:flex;height:calc(100vh - var(--th));margin-top:var(--th)}
.lp{width:var(--lw);flex-shrink:0;background:var(--sf);border-right:1px solid var(--bd);overflow:hidden;display:flex;flex-direction:column}
.lp-sc{flex:1;overflow-y:auto;padding:14px 13px}
.rp{flex:1;overflow-y:auto;padding:18px 20px;background:var(--bg)}
.lsec{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;
  color:var(--hi);margin:14px 0 7px}

/* ACCORDION */

.acc-h:hover,.acc-h.open{background:var(--bl-bg)}
.ah-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ah-name{flex:1;font-weight:600;font-size:12px;display:flex;justify-content:space-between;align-items:center}
/* FIX 5: Latest month tag */
.ah-last{font-size:9px;font-weight:400;color:var(--hi);background:var(--sf2);padding:1px 5px;border-radius:4px}
.ah-st{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.st-ok{background:#1D9E75}.st-pend{background:#EF9F27}
.ah-ch{font-size:9px;color:var(--hi);transition:transform .2s}

.ks-l{font-size:11px;color:var(--mu);flex:1}
.ks-v{font-size:12px;font-weight:600}.ks-d{font-size:10px;margin-left:4px}

.mysel{flex:1;padding:7px 8px;font-size:12px;font-weight:500;border:1px solid var(--bd);border-radius:var(--r)}

.bg{background:var(--gn-bg);color:var(--gn)}.ba{background:var(--am-bg);color:var(--am)}

/* CHARTS AREA */
.rp-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px}

.drsel{flex:1;padding:5px 7px;border:1px solid var(--bd);border-radius:var(--r);font-size:11px}
.dr-apply{width:100%;padding:6px;border:none;border-radius:var(--r);background:var(--bl);color:#fff;font-size:11px;font-weight:600}

/* STATUS TABLE */
.stbl-w{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);overflow:hidden;margin-bottom:14px}
.stbl-h{padding:12px 16px;font-size:13px;font-weight:700;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between}
table{width:100%;border-collapse:collapse}
thead th{padding:8px 14px;text-align:left;font-size:10px;font-weight:700;color:var(--mu);text-transform:uppercase;border-bottom:1px solid var(--bd)}
tbody td{padding:9px 14px;font-size:12px;border-bottom:1px solid var(--bd)}

#g-loader{position:fixed;inset:0;background:rgba(244,243,239,.85);display:flex;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:12px}
.gl-spin{width:26px;height:26px;border:3px solid var(--bd);border-top-color:var(--bl);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>

function el(id){return document.getElementById(id);}

function fetchSheetData(cb){
  setSyncBadge('loading','Syncing…');
  fetch(SHEET_URL+'&t='+Date.now()).then(r=>r.text()).then(csv=>{
    var parsed = parseCSV(csv);
    GS_HDR = parsed[0].map(h=>h.trim());
    GS_DATA = parsed.slice(1).filter(r=>r[0]&&r[0].trim());
    setSyncBadge('ok','Live · '+GS_DATA.length+' rows');
    if(cb)cb();
  }).catch(e=>{ setSyncBadge('err','Offline'); if(cb)cb(); });
}

function parseCSV(text){
  var rows=[], cur=[], field='', inQ=false;
  for(var i=0;i<text.length;i++){
    var ch=text[i];
    if(inQ){if(ch==='"'&&text[i+1]==='"'){field+='"';i++;}else if(ch==='"')inQ=false;else field+=ch;}
    else{if(ch==='"')inQ=true;else if(ch===','){cur.push(field);field='';}else if(ch==='\n'||(ch==='\r'&&text[i+1]==='\n')){if(ch==='\r')i++;cur.push(field);field='';rows.push(cur);cur=[];}else field+=ch;}
  }
  if(field||cur.length)cur.push(field);rows.push(cur);return rows;
}

function setSyncBadge(state, txt){ var b=el('sync-badge'); b.textContent=txt; b.className='sync-badge sync-'+state; }

// FIX 4: Khớp logic tháng giữa Sheet (1-12) và JS (0-11)
function getGSVal(dept, year, month, key){
  var ki = GS_HDR.indexOf(key); if(ki<0) return null;
  for(var i=0;i<GS_DATA.length;i++){
    var r=GS_DATA[i];
    if(r[0]===dept && parseInt(r[1])===(month+1) && parseInt(r[2])===year){
      var v=r[ki]; if(v===''||v==null)return null;
      return isNaN(parseFloat(v))?v:parseFloat(v);
    }
  }
  return null;
}

function getGSRow(dept, year, month){
  for(var i=0;i<GS_DATA.length;i++){
    var r=GS_DATA[i];
    if(r[0]===dept && parseInt(r[1])===(month+1) && parseInt(r[2])===year) return r;
  }
  return null;
}

  el('t-av').textContent=U.ini; el('t-av').style.cssText=`background:${U.color}25;color:${U.color}`;
  el('t-name').textContent=U.name;
  el('t-dept-label').textContent = U.role==='bod' ? '' : U.dept; // Chữ HR thứ 1

  fetchSheetData(()=>{
    if(U.role==='bod'){ el('t-badge').textContent='Management'; el('t-badge').className='tbadge tbm'; buildBodLeft(); renderBodRight(null); }
    else { el('t-badge').textContent='Department'; el('t-badge').className='tbadge tba'; deptId=U.dept; buildDeptLeft(); renderDeptRight(); }
  });
}

function doLogout(){ location.reload(); }

function buildDeptLeft(){
  var dept=DEPTS.find(d=>d.id===deptId), row=getGSRow(deptId,selY,selM), saved=!!row;
  var inputs=dept.kpis.map(k=>{
    var v=saved?getGSVal(deptId,selY,selM,k.k):null;
    return `<div class="ki"><label>${k.l} (${k.u})</label><input class="ki-in" type="number" id="ki-${k.k}" step="any" value="${v!=null?v:''}"></div>`;
  }).join('');
  el('lp-body').innerHTML = `
    <div class="lsec">Period</div>
    <div class="my-row">
      <select class="mysel" id="s-m">${MN.map((m,i)=>`<option value="${i}" ${i===selM?'selected':''}>${m}</option>`).join('')}</select>
      <select class="mysel" id="s-y">${YRS.map(y=>`<option value="${y}" ${y===selY?'selected':''}>${y}</option>`).join('')}</select>
    </div>
    <div class="inp-st"><span style="font-size:11px">Status</span><span class="badge ${saved?'bg':'ba'}">${saved?'Submitted':'Pending'}</span></div>
    <div class="ki-list">${inputs}</div>
    <textarea class="ki-ta" id="ki-cmt" placeholder="Notes...">${saved?getGSVal(deptId,selY,selM,'comment')||'':''}</textarea>
    <button class="sv-btn" id="sv-btn">Save KPIs</button>
    <div class="lsec" style="margin-top:20px">Chart Range</div>
    <div class="dr-box">
      <div class="dr-row"><label>From</label><select class="drsel" id="df-m">${MN.map((m,i)=>`<option value="${i}" ${i===drF.m?'selected':''}>${m}</option>`).join('')}</select><select class="drsel" id="df-y">${YRS.map(y=>`<option value="${y}" ${y===drF.y?'selected':''}>${y}</option>`).join('')}</select></div>
      <div class="dr-row"><label>To</label><select class="drsel" id="dt-m">${MN.map((m,i)=>`<option value="${i}" ${i===drT.m?'selected':''}>${m}</option>`).join('')}</select><select class="drsel" id="dt-y">${YRS.map(y=>`<option value="${y}" ${y===drT.y?'selected':''}>${y}</option>`).join('')}</select></div>
      <button class="dr-apply" id="dr-apply-d">Apply Range</button>
    </div>`;
}

// FIX 5: Tìm tháng cuối cùng có dữ liệu
function getLatestMonth(did){
  var lastRow = [...GS_DATA].reverse().find(r=>r[0]===did);
  if(lastRow) return MN[parseInt(lastRow[1])-1] + ' ' + lastRow[2];
  return 'No Data';
}

function buildBodLeft(){
  var html = `<div class="lsec">Chart Range</div><div class="dr-box">
    <div class="dr-row"><label>From</label><select class="drsel" id="bdf-m">${MN.map((m,i)=>`<option value="${i}" ${i===drF.m?'selected':''}>${m}</option>`).join('')}</select><select class="drsel" id="bdf-y">${YRS.map(y=>`<option value="${y}" ${y===drF.y?'selected':''}>${y}</option>`).join('')}</select></div>
    <div class="dr-row"><label>To</label><select class="drsel" id="bdt-m">${MN.map((m,i)=>`<option value="${i}" ${i===drT.m?'selected':''}>${m}</option>`).join('')}</select><select class="drsel" id="bdt-y">${YRS.map(y=>`<option value="${y}" ${y===drT.y?'selected':''}>${y}</option>`).join('')}</select></div>
    <button class="dr-apply" id="dr-apply-b">Apply Range</button></div><div class="lsec">Departments</div>`;
  DEPTS.forEach(d=>{
    var has = !!getGSRow(d.id,NY,NM), open = accOpen===d.id;
    html += `<div class="acc" id="acc-${d.id}">
      <div class="acc-h ${open?'open':''}" data-dept="${d.id}">
        <span class="ah-dot" style="background:${d.color}"></span>
        <span class="ah-name">${d.name} <span class="ah-last">${getLatestMonth(d.id)}</span></span>
        <span class="ah-st ${has?'st-ok':'st-pend'}"></span>
        <span class="ah-ch ${open?'open':''}">▶</span>
      </div>
      <div class="acc-b ${open?'open':''}" id="ab-${d.id}">${buildAccBody(d)}</div>
    </div>`;
  });
  el('lp-body').innerHTML = html;
}

function buildAccBody(dept){
  var row=getGSRow(dept.id,NY,NM);
  var rows=dept.kpis.map(k=>{
    var v=row?getGSVal(dept.id,NY,NM,k.k):null;
    return `<div class="ks-row"><span class="ks-l">${k.l}</span><span class="ks-v" style="color:${dept.color}">${v!=null?fmtV(v,k):'—'}</span></div>`;
  }).join('');
  return `<div>${rows}</div><button class="vc-btn" data-dept="${dept.id}">View detailed charts →</button>`;
}

function renderDeptRight(){
  var dept=DEPTS.find(d=>d.id===deptId); el('rp-title').textContent=dept.name; el('rp-sub').textContent=dept.purpose;
  var range=buildRange(deptId); killCharts('d_'); el('rp-body').innerHTML='<div class="charts-col" id="d-col"></div>';
  var col=el('d-col');
  if(dept.overlayCharts){
    dept.overlayCharts.forEach((oc,i)=>renderOverlayChart(col,'d_oc_'+i,oc,range,dept.color));
  } else {
    dept.kpis.forEach((k,i)=>{
      var vals=range.dkeys.map(dk=>getGSVal(deptId,dk.y,dk.m,k.k));
      var div=document.createElement('div'); div.className='cc';
      div.innerHTML=`<div class="cc-t">${k.l}</div><div class="cc-s">${k.u}</div><div class="cc-w"><canvas id="d_${i}"></canvas></div>`;
      col.appendChild(div); CH['d_'+i]=mkLine('d_'+i,range.labels,k.l,vals,dept.color,k.u);
    });
  }
}

function renderBodRight(id){
  killCharts('b_'); var body=el('rp-body');
  if(!id){
    el('btn-back-overview').classList.add('hidden');
    el('rp-title').textContent='CMI Overview'; el('rp-sub').textContent='Consolidated performance';
    var tRows=DEPTS.map(d=>{
      var sub=!!getGSRow(d.id,NY,NM);
      return `<tr><td>${d.name}</td><td>${d.mgr}</td><td><span class="badge ${sub?'bg':'ba'}">${sub?'Done':'Pending'}</span></td><td><button class="vc-btn" style="margin:0;width:auto;padding:3px 10px" data-dept="${d.id}">View</button></td></tr>`;
    }).join('');
    body.innerHTML=`<div class="stbl-w"><table><thead><tr><th>Dept</th><th>Manager</th><th>Status</th><th>Action</th></tr></thead><tbody>${tRows}</tbody></table></div>`;
    return;
  }
  el('btn-back-overview').classList.remove('hidden');
  var dept=DEPTS.find(d=>d.id===id); el('rp-title').textContent=dept.name; el('rp-sub').textContent=dept.purpose;
  var range=buildRange(id); body.innerHTML='<div class="charts-col" id="b-col"></div>';
  var col=el('b-col');
  if(dept.overlayCharts){
    dept.overlayCharts.forEach((oc,i)=> {
       var oldId = deptId; deptId = id; renderOverlayChart(col,'b_oc_'+i,oc,range,dept.color); deptId = oldId;
    });
  } else {
    dept.kpis.forEach((k,i)=>{
      var vals=range.dkeys.map(dk=>getGSVal(id,dk.y,dk.m,k.k));
      var div=document.createElement('div'); div.className='cc';
      div.innerHTML=`<div class="cc-t">${k.l}</div><div class="cc-s">${k.u}</div><div class="cc-w"><canvas id="b_${i}"></canvas></div>`;
      col.appendChild(div); CH['b_'+i]=mkLine('b_'+i,range.labels,k.l,vals,dept.color,k.u);
    });
  }
}

function renderOverlayChart(col, cid, oc, range, fallbackColor){
  var div=document.createElement('div'); div.className='cc';
  div.innerHTML=`<div class="cc-t">${oc.title}</div><div class="cc-w tall"><canvas id="${cid}"></canvas></div>`;
  col.appendChild(div);
  var datasets=oc.datasets.map(ds=>{
    var vals=range.dkeys.map(dk=>getGSVal(deptId,dk.y,dk.m,ds.key));
    return {label:ds.label,data:vals,borderColor:ds.color,backgroundColor:ds.color+(ds.type==='bar'?'cc':'18'),type:ds.type,tension:0.3,fill:ds.type==='line',spanGaps:true};
  });
  CH[cid]=new Chart(el(cid),{data:{labels:range.labels,datasets:datasets},options:getChartOpts()});
}

// FIX 1: Làm tròn số trên Chart (Ticks & Tooltips)
function getChartOpts(unit){
  return {
    responsive:true,maintainAspectRatio:false,
    plugins:{
      legend:{display:true,labels:{boxWidth:10,font:{size:10}}},
      tooltip:{
        callbacks:{
          label: (ctx) => {
            let val = ctx.raw;
            return ctx.dataset.label + ': ' + (val !== null ? val.toLocaleString(undefined,{minimumFractionDigits:0, maximumFractionDigits:1}) : 'N/A');
          }
        }
      }
    },
    scales:{
      y:{ticks:{font:{size:10}, callback:v=>v.toLocaleString(undefined,{maximumFractionDigits:1})}},
      x:{ticks:{font:{size:10},maxRotation:45}}
    }
  };
}

function mkLine(id,labels,label,data,color,unit){
  return new Chart(el(id),{type:'line',data:{labels:labels,datasets:[{label:label,data:data,borderColor:color,backgroundColor:color+'18',fill:true,tension:0.3,spanGaps:true}]},options:getChartOpts(unit)});
}

function buildRange(did){
  var labels=[],dkeys=[],cy=drF.y,cm=drF.m;
  while(cy<drT.y||(cy===drT.y&&cm<=drT.m)){
    labels.push(MN[cm]+' '+cy); dkeys.push({y:cy,m:cm});
    cm++;if(cm>11){cm=0;cy++;} if(labels.length>48)break;
  }
  return {labels,dkeys};
}

function killCharts(pfx){ Object.keys(CH).filter(k=>k.indexOf(pfx)===0).forEach(k=>{CH[k].destroy();delete CH[k];}); }
function fmtV(v,k){ if(v==null)return'—'; if(k.t==='c')return '$'+v.toLocaleString(); return v.toLocaleString(undefined,{maximumFractionDigits:1})+(k.u==='%'?'%':''); }

// EVENTS
document.addEventListener('DOMContentLoaded',()=>{
  el('btn-login').onclick=doLogin;
  el('btn-logout').onclick=doLogout;
  el('btn-back-overview').onclick=()=>renderBodRight(null);
  el('lp-body').onclick=e=>{
    var t=e.target, ah=t.closest('.acc-h');
    if(ah){accOpen=accOpen===ah.dataset.dept?null:ah.dataset.dept;buildBodLeft();if(accOpen)renderBodRight(accOpen);return;}
    if(t.classList.contains('vc-btn')){renderBodRight(t.dataset.dept);return;}
    if(t.id==='dr-apply-d'){drF={m:parseInt(el('df-m').value),y:parseInt(el('df-y').value)};drT={m:parseInt(el('dt-m').value),y:parseInt(el('dt-y').value)};renderDeptRight();return;}
    if(t.id==='dr-apply-b'){drF={m:parseInt(el('bdf-m').value),y:parseInt(el('bdf-y').value)};drT={m:parseInt(el('bdt-m').value),y:parseInt(el('bdt-y').value)};renderBodRight(accOpen);return;}
  };
  el('lp-body').onchange=e=>{ if(e.target.id==='s-m'||e.target.id==='s-y'){selM=parseInt(el('s-m').value);selY=parseInt(el('s-y').value);buildDeptLeft();} };
});
</script>
