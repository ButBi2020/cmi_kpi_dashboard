<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMI · KPI Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f3ef;--sf:#fff;--sf2:#eeede8;--sf3:#e5e4de;
  --bd:#dddcd5;--bd2:#c8c7bf;
  --tx:#1a1a17;--mu:#68675f;--hi:#a0a099;
  --bl:#1255a0;--bl-bg:#e7f0fb;--bl-lt:#c4d8f4;
  --gn:#0b6b4e;--gn-bg:#dff3ec;
  --am:#7a4a08;--am-bg:#faebd5;
  --rd:#9c2828;--rd-bg:#fbe9e9;
  --lw:274px;--th:46px;--r:7px;--rl:11px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:13px;background:var(--bg);color:var(--tx);min-height:100vh;overflow:hidden}
input,button,select,textarea{font-family:inherit;font-size:13px}
button{cursor:pointer}
.hidden{display:none!important}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}

/* LOGIN */
#pg-login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.lcard{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);padding:36px;width:340px}
.lbrand{font-size:22px;font-weight:700;margin-bottom:3px}
.lsub{color:var(--mu);font-size:12px;margin-bottom:26px}
.lf{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.lf label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--mu)}
.lf input{padding:9px 11px;border:1px solid var(--bd);border-radius:var(--r);
  background:var(--sf);color:var(--tx);font-size:14px}
.lf input:focus{outline:none;border-color:var(--bl);box-shadow:0 0 0 3px rgba(18,85,160,.1)}
#btn-login{width:100%;padding:10px;background:var(--bl);color:#fff;border:none;
  border-radius:var(--r);font-size:14px;font-weight:600;margin-top:4px}
#btn-login:hover{opacity:.88}
#l-err{color:var(--rd);font-size:12px;margin-top:8px;padding:7px 10px;
  background:var(--rd-bg);border-radius:var(--r);display:none}
.lhint{margin-top:18px;padding-top:14px;border-top:1px solid var(--bd);
  font-size:11px;color:var(--hi);line-height:1.6}
.lhint b{color:var(--mu)}

/* TOPBAR */
.topbar{height:var(--th);background:var(--sf);border-bottom:1px solid var(--bd);
  display:flex;align-items:center;justify-content:space-between;padding:0 18px;
  position:fixed;top:0;left:0;right:0;z-index:100}
.tlogo{font-weight:700;font-size:14px}
.tlogo span{color:var(--mu);font-weight:400}
.tright{display:flex;align-items:center;gap:10px}
.tbadge{font-size:11px;font-weight:600;padding:2px 9px;border-radius:12px}
.tba{background:var(--bl-bg);color:var(--bl)}.tbm{background:var(--am-bg);color:var(--am)}
.tav{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:700}
#btn-logout{padding:5px 11px;border-radius:var(--r);border:1px solid var(--bd2);
  background:transparent;color:var(--mu);font-size:11px}
#btn-logout:hover{background:var(--sf2);color:var(--tx)}
.sync-badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;cursor:pointer}
.sync-ok{background:var(--gn-bg);color:var(--gn)}
.sync-loading{background:var(--am-bg);color:var(--am)}
.sync-err{background:var(--rd-bg);color:var(--rd)}

/* SHELL */
#pg-app{display:none;flex-direction:column}
.shell{display:flex;height:calc(100vh - var(--th));margin-top:var(--th)}
.lp{width:var(--lw);flex-shrink:0;background:var(--sf);border-right:1px solid var(--bd);overflow:hidden;display:flex;flex-direction:column}
.lp-sc{flex:1;overflow-y:auto;padding:14px 13px}
.rp{flex:1;overflow-y:auto;padding:18px 20px;background:var(--bg)}
.lsec{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;
  color:var(--hi);margin:14px 0 7px}
.lsec:first-child{margin-top:0}

/* DATE RANGE */
.dr-box{background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r);padding:10px 11px;margin-bottom:4px}
.dr-quick{display:flex;gap:4px;margin-bottom:8px}
.drq{padding:3px 9px;border-radius:12px;border:1px solid var(--bd);
  background:transparent;color:var(--mu);font-size:10px;font-weight:600;cursor:pointer}
.drq:hover,.drq.act{background:var(--bl);color:#fff;border-color:var(--bl)}
.dr-row{display:flex;gap:5px;align-items:center;margin-bottom:6px}
.dr-row label{font-size:10px;color:var(--mu);width:26px;font-weight:600;flex-shrink:0}
.drsel,.mysel{flex:1;padding:5px 7px;border:1px solid var(--bd);border-radius:var(--r);
  background:var(--sf);color:var(--tx);font-size:11px}
.dr-apply{width:100%;padding:6px;border:none;border-radius:var(--r);
  background:var(--bl);color:#fff;font-size:11px;font-weight:600;cursor:pointer;margin-top:3px}

/* ACCORDION */
.acc{border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;margin-bottom:6px}
.acc-h{display:flex;align-items:center;gap:7px;padding:9px 10px;cursor:pointer;user-select:none;transition:background .12s}
.acc-h:hover,.acc-h.open{background:var(--bl-bg)}
.ah-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ah-name{flex:1;font-weight:600;font-size:12px}
.ah-st{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.st-ok{background:#1D9E75}.st-pend{background:#EF9F27}
.ah-ch{font-size:9px;color:var(--hi);transition:transform .2s}
.ah-ch.open{transform:rotate(90deg)}
.acc-b{display:none;border-top:1px solid var(--bd);background:var(--sf2);padding:10px 11px}
.acc-b.open{display:block}
.ks-row{display:flex;align-items:baseline;padding:4px 0;border-bottom:1px solid var(--bd)}
.ks-row:last-of-type{border-bottom:none}
.ks-l{font-size:11px;color:var(--mu);flex:1}
.ks-v{font-size:12px;font-weight:600}.ks-d{font-size:10px;margin-left:4px}
.du{color:var(--gn)}.dd{color:var(--rd)}.dn{color:var(--hi)}
.ks-cmt{margin-top:7px;padding:6px 8px;background:var(--sf);border-radius:var(--r);
  font-size:11px;color:var(--mu);font-style:italic;line-height:1.4;border:1px solid var(--bd)}
.vc-btn{width:100%;margin-top:8px;padding:6px;border-radius:var(--r);
  border:1px solid var(--bl-lt);background:var(--bl-bg);color:var(--bl);
  font-size:11px;font-weight:600;cursor:pointer}
.vc-btn:hover{background:var(--bl-lt)}

/* INPUT FORM */
.my-row{display:flex;gap:6px;margin-bottom:11px}
.mysel{padding:7px 8px;font-size:12px;font-weight:500}
.inp-st{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:10px;padding:6px 9px;border-radius:var(--r);background:var(--sf2);border:1px solid var(--bd)}
.badge{display:inline-flex;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.bg{background:var(--gn-bg);color:var(--gn)}.ba{background:var(--am-bg);color:var(--am)}
.ki-list{display:flex;flex-direction:column;gap:9px;margin-bottom:12px}
.ki{display:flex;flex-direction:column;gap:3px}
.ki label{font-size:11px;color:var(--mu);font-weight:600}
.ki-in{padding:7px 9px;border:1px solid var(--bd);border-radius:var(--r);
  background:var(--sf);color:var(--tx);width:100%}
.ki-in:focus{outline:none;border-color:var(--bl)}
.ki-ta{padding:7px 9px;border:1px solid var(--bd);border-radius:var(--r);
  background:var(--sf);color:var(--tx);resize:none;min-height:50px;width:100%;
  font-family:inherit;font-size:12px;line-height:1.4}
.ki-ta:focus{outline:none;border-color:var(--bl)}
.sv-btn{width:100%;padding:9px;border:none;border-radius:var(--r);
  background:var(--bl);color:#fff;font-size:13px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:6px}
.sv-btn:hover{opacity:.88}
.sv-ok{font-size:11px;text-align:center;color:var(--gn);margin-top:5px;display:none;font-weight:600}
.sv-er{font-size:11px;text-align:center;color:var(--rd);margin-top:5px;display:none}
.spin{width:13px;height:13px;border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;animation:sp .6s linear infinite;display:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* CHARTS */
.rp-title{font-size:17px;font-weight:700;margin-bottom:3px}
.rp-sub{font-size:12px;color:var(--mu);margin-bottom:16px}
.charts-col{display:flex;flex-direction:column;gap:14px}
.cc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);padding:16px 18px}
.cc-t{font-size:13px;font-weight:700;margin-bottom:2px}
.cc-s{font-size:11px;color:var(--mu);margin-bottom:12px}
.cc-w{position:relative;height:185px}
.cc-w.tall{height:220px}
.legend{display:flex;gap:16px;margin-bottom:8px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--mu)}
.legend-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}

/* STATUS TABLE */
.stbl-w{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);overflow:hidden;margin-bottom:14px}
.stbl-h{padding:12px 16px;font-size:13px;font-weight:700;border-bottom:1px solid var(--bd);
  display:flex;align-items:center;justify-content:space-between}
table{width:100%;border-collapse:collapse}
thead th{padding:8px 14px;text-align:left;font-size:10px;font-weight:700;color:var(--mu);
  text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--bd)}
tbody td{padding:9px 14px;font-size:12px;border-bottom:1px solid var(--bd)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--sf2)}

/* LOADER */
#g-loader{position:fixed;inset:0;background:rgba(244,243,239,.85);
  display:flex;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:12px}
.gl-spin{width:26px;height:26px;border:3px solid var(--bd);border-top-color:var(--bl);
  border-radius:50%;animation:sp .7s linear infinite}
.gl-lbl{font-size:12px;color:var(--mu)}
</style>
</head>
<body>

<!-- LOADER -->
<div id="g-loader" class="hidden">
  <div class="gl-spin"></div>
  <div class="gl-lbl" id="gl-lbl">Loading…</div>
</div>

<!-- LOGIN -->
<div id="pg-login">
  <div class="lcard">
    <div class="lbrand">CMI Operations</div>
    <div class="lsub">KPI Reporting System</div>
    <div class="lf"><label>Username</label><input id="l-u" type="text" autocomplete="off" placeholder="e.g. production"></div>
    <div class="lf"><label>Password</label><input id="l-p" type="password" placeholder="••••••••"></div>
    <div id="l-err"></div>
    <button id="btn-login">Sign in</button>
    <div class="lhint">
      <b>Accounts:</b> bod · production · sales · qa · finance · supply · hr · cs · design · it · marketing · project_dev · property · tl_handover · cid<br>
      Password: <b>[username]123</b>
    </div>
  </div>
</div>

<!-- APP -->
<div id="pg-app">
  <div class="topbar">
    <div class="tlogo">CMI <span>· KPI Dashboard</span></div>
    <div class="tright">
      <span id="sync-badge" class="sync-badge sync-loading">Loading data…</span>
      <span id="t-badge" class="tbadge"></span>
      <span id="t-name" style="font-size:12px;color:var(--mu)"></span>
      <div id="t-av" class="tav"></div>
      <button id="btn-logout">Sign out</button>
    </div>
  </div>
  <div class="shell">
    <div class="lp"><div class="lp-sc" id="lp-body"></div></div>
    <div class="rp" id="rp-panel">
      <div id="rp-title" class="rp-title">CMI Dashboard</div>
      <div id="rp-sub" class="rp-sub">Select a department</div>
      <div id="rp-body"></div>
    </div>
  </div>
</div>

function fetchSheetData(cb){
  setSyncBadge('loading','Syncing…');
  var url = SHEET_URL + '&t=' + Date.now(); // cache bust
  fetch(url)
    .then(function(r){return r.text();})
    .then(function(csv){
      var parsed = parseCSV(csv);
      if(parsed.length < 2){setSyncBadge('err','No data'); if(cb)cb(); return;}
      GS_HDR  = parsed[0].map(function(h){return h.trim();});
      GS_DATA = parsed.slice(1).filter(function(r){return r[0] && r[0].trim();});
      setSyncBadge('ok','Live · '+GS_DATA.length+' rows');
      if(cb)cb();
    })
    .catch(function(e){
      setSyncBadge('err','Offline (demo data)');
      GS_DATA=[]; GS_HDR=[];
      if(cb)cb();
    });
}

function parseCSV(text){
  var rows=[], cur=[], field='', inQ=false;
  for(var i=0;i<text.length;i++){
    var ch=text[i];
    if(inQ){
      if(ch==='"'&&text[i+1]==='"'){field+='"';i++;}
      else if(ch==='"'){inQ=false;}
      else field+=ch;
    } else {
      if(ch==='"'){inQ=true;}
      else if(ch===','){cur.push(field);field='';}
      else if(ch==='\n'||(ch==='\r'&&text[i+1]==='\n')){
        if(ch==='\r')i++;
        cur.push(field);field='';rows.push(cur);cur=[];
      } else field+=ch;
    }
  }
  if(field||cur.length)cur.push(field);
  if(cur.length>1||cur[0])rows.push(cur);
  return rows;
}

function setSyncBadge(state, txt){
  var b=el('sync-badge');
  if(!b)return;
  b.textContent=txt;
  b.className='sync-badge sync-'+state;
}

// get value from GS_DATA for a dept/year/month and column key
function getGSVal(dept, year, month, key){
  var ki = GS_HDR.indexOf(key);
  if(ki<0) return null;
  for(var i=0;i<GS_DATA.length;i++){
    var r=GS_DATA[i];
    if(r[0]===dept && parseInt(r[1])===month && parseInt(r[2])===year){
      var v=r[ki]; if(v===''||v===undefined)return null;
      return isNaN(parseFloat(v))?v:parseFloat(v);
    }
  }
  return null;
}

function getGSRow(dept, year, month){
  for(var i=0;i<GS_DATA.length;i++){
    var r=GS_DATA[i];
    if(r[0]===dept && parseInt(r[1])===month && parseInt(r[2])===year) return r;
  }
  return null;
}

function saveDept(){
  var dept=DEPTS.find(function(d){return d.id===deptId;});
  var sp=el('sv-sp'),lb=el('sv-lb'),ok=el('sv-ok'),er=el('sv-er');
  if(!sp)return;
  sp.style.display='inline-block';lb.textContent='Saving…';
  ok.style.display='none';er.style.display='none';
  var payload={
    dept:deptId,month:selM,year:selY,
    submitted_by:U.username,comment:el('ki-cmt').value||''
  };
  dept.kpis.forEach(function(k){
    var inp=el('ki-'+k.k);
    if(inp)payload[k.k]=inp.value!==''?inp.value:null;
  });
  if(!SCRIPT_URL){
    // Demo mode: store locally
    var mockRow=GS_HDR.map(function(h){return payload[h]!=null?payload[h]:'';});
    // update or append
    var found=false;
    for(var i=0;i<GS_DATA.length;i++){
      if(GS_DATA[i][0]===deptId&&parseInt(GS_DATA[i][1])===selM&&parseInt(GS_DATA[i][2])===selY){
        GS_DATA[i]=mockRow;found=true;break;
      }
    }
    if(!found)GS_DATA.push(mockRow);
    sp.style.display='none';lb.textContent='Save KPIs';
    ok.style.display='block';
    var badge=el('st-badge');if(badge){badge.textContent='Submitted';badge.className='badge bg';}
    renderDeptRight();
    setTimeout(function(){ok.style.display='none';},3000);
    return;
  }
  fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'saveKPI',data:payload})})
    .then(function(r){return r.json();})
    .then(function(){
      sp.style.display='none';lb.textContent='Save KPIs';ok.style.display='block';
      fetchSheetData(function(){buildDeptLeft();renderDeptRight();});
      setTimeout(function(){ok.style.display='none';},3000);
    })
    .catch(function(e){
      sp.style.display='none';lb.textContent='Save KPIs';
      er.textContent='Save failed. Check connection.';er.style.display='block';
    });
}

function renderOverlayChart(col, cid, oc, range, fallbackColor){
  var isMulti=oc.datasets.length>1;
  var legendHtml=isMulti?'<div class="legend">'+oc.datasets.map(function(ds){
    return '<div class="legend-item"><span class="legend-dot" style="background:'+ds.color+'"></span>'+ds.label+'</div>';
  }).join('')+'</div>':'';
  var div=document.createElement('div');div.className='cc';
  div.innerHTML='<div class="cc-t">'+oc.title+'</div>'
    +'<div class="cc-s">'+rangeLabel(range)+'</div>'
    +legendHtml
    +'<div class="cc-w '+(isMulti?'tall':'')+'"><canvas id="'+cid+'"></canvas></div>';
  col.appendChild(div);
  var datasets=oc.datasets.map(function(ds){
    var vals=range.dkeys.map(function(k){return getGSValByKey(deptId,k,ds.key);});
    var base={label:ds.label,data:vals,borderColor:ds.color,backgroundColor:ds.color+(ds.type==='bar'?'cc':'18'),
      tension:.3,fill:ds.type!=='bar',pointRadius:range.labels.length>24?2:4,
      pointBackgroundColor:ds.color,spanGaps:true};
    if(ds.type==='bar'){base.type='bar';base.borderRadius=3;base.borderWidth=1;}
    return base;
  });
  var firstUnit=oc.datasets[0].key;
  var kpiDef=DEPTS.find(function(d){return d.id===deptId;});
  var unit='';
  if(kpiDef){var kf=kpiDef.kpis.find(function(k){return k.k===firstUnit;});if(kf)unit=kf.u;}
  CH[cid]=new Chart(document.getElementById(cid),{
    type:oc.datasets[0].type==='bar'?'bar':'line',
    data:{labels:range.labels,datasets:datasets},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        y:{beginAtZero:unit!=='%',grid:{color:'rgba(0,0,0,.05)'},ticks:{font:{size:10}}},
        x:{grid:{display:false},ticks:{font:{size:10},maxRotation:45,autoSkip:true,maxTicksLimit:range.labels.length>18?10:range.labels.length}}
      }
    }
  });
}

    if(v!=null&&pv!=null&&pv!==0){

      +'<span class="ks-l">'+k.l+'</span>'
      +'<span class="ks-v" style="color:'+dept.color+'">'+(v!=null?fmtV(v,k):'—')+'</span>'
      +(dlt?'<span class="ks-d '+dc+'">'+dlt+'</span>':'')
      +'</div>';
  }).join('');
  var cmt=row?getGSVal(dept.id,NY,NM,'comment')||'':'';
  return '<div>'+rows+'</div>'
    +(cmt?'<div class="ks-cmt">'+cmt+'</div>':'')
    +'<button class="vc-btn" data-dept="'+dept.id+'">View all charts →</button>';
}

function toggleAcc(id){
  accOpen=accOpen===id?null:id;
  DEPTS.forEach(function(d){
    var h=document.querySelector('#acc-'+d.id+' .acc-h');
    var b=el('ab-'+d.id);
    var c=document.querySelector('#acc-'+d.id+' .ah-ch');
    var open=accOpen===d.id;
    if(h)h.classList.toggle('open',open);
    if(b)b.classList.toggle('open',open);
    if(c)c.classList.toggle('open',open);
  });
  if(accOpen)renderBodRight(accOpen);
}
function BodViewDept(id){accOpen=id;buildBodLeft();renderBodRight(id);}

// ═══════════════════════════════════════════
// Bod — RIGHT PANEL
// ═══════════════════════════════════════════
function renderBodRight(id){
  killCharts('b_');
  var body=el('rp-body');
  if(!id){
    el('rp-title').textContent='All Departments';
    var subm=DEPTS.filter(function(d){return !!getGSRow(d.id,NY,NM);}).length;
    el('rp-sub').textContent=MN[NM]+' '+NY+' · '+subm+'/'+DEPTS.length+' submitted';
    var tRows=DEPTS.map(function(d){
      var r=getGSRow(d.id,NY,NM);var sub=!!r;
      var ts=sub?(getGSVal(d.id,NY,NM,'submitted_at')||'—'):'—';
      return '<tr>'
        +'<td><span style="display:inline-flex;align-items:center;gap:6px">'
        +'<span style="width:7px;height:7px;border-radius:50%;background:'+d.color+';display:inline-block"></span>'+d.name+'</span></td>'
        +'<td style="color:var(--mu)">'+d.mgr+'</td>'
        +'<td><span class="badge '+(sub?'bg':'ba')+'">'+(sub?'Submitted':'Pending')+'</span></td>'
        +'<td style="color:var(--mu);font-size:11px">'+ts+'</td>'
        +'<td><button class="vc-btn" style="width:auto;padding:4px 10px;margin:0" data-dept="'+d.id+'">Charts →</button></td>'
        +'</tr>';
    }).join('');
    var ovCharts=DEPTS.map(function(d,i){
      return '<div class="cc">'
        +'<div class="cc-t" style="display:flex;align-items:center;gap:6px">'
        +'<span style="width:8px;height:8px;border-radius:50%;background:'+d.color+';display:inline-block;flex-shrink:0"></span>'
        +d.name+' — '+d.kpis[0].l+'</div>'
        +'<div class="cc-s">'+d.kpis[0].u+'</div>'
        +'<div class="cc-w"><canvas id="b_ov_'+i+'"></canvas></div></div>';
    }).join('');
    body.innerHTML='<div class="stbl-w"><div class="stbl-h">Submission status — '+MN[NM]+' '+NY
      +'<span style="font-size:11px;font-weight:400;color:var(--mu)">'+subm+'/'+DEPTS.length+'</span></div>'
      +'<table><thead><tr><th>Department</th><th>Manager</th><th>Status</th><th>Submitted at</th><th></th></tr></thead>'
      +'<tbody>'+tRows+'</tbody></table></div>'
      +'<div class="charts-col">'+ovCharts+'</div>';
    DEPTS.forEach(function(d,i){
      var range=buildRange(d.id);
      var vals=range.dkeys.map(function(k){return getGSValByKey(d.id,k,d.kpis[0].k);});
      CH['b_ov_'+i]=mkLine('b_ov_'+i,range.labels,d.kpis[0].l,vals,d.color,d.kpis[0].u);
    });
    return;
  }
  var dept=DEPTS.find(function(d){return d.id===id;});
  el('rp-title').textContent=dept.name;
  el('rp-sub').textContent=dept.purpose;
  var range=buildRange(id);
  body.innerHTML='<div class="charts-col" id="b-col"></div>';
  var col=el('b-col');
  if(dept.overlayCharts){
    dept.overlayCharts.forEach(function(oc,i){
      // swap deptId temporarily for Bod view
      var origDeptId=deptId;deptId=id;
      renderOverlayChart(col,'b_oc_'+i,oc,range,dept.color);
      deptId=origDeptId;
    });
  } else {
    dept.kpis.forEach(function(kpi,i){
      var vals=range.dkeys.map(function(k){return getGSValByKey(id,k,kpi.k);});
      var cid='b_'+i;
      var div=document.createElement('div');div.className='cc';
      div.innerHTML='<div class="cc-t">'+kpi.l+'</div>'
        +'<div class="cc-s">'+kpi.u+' · '+rangeLabel(range)+'</div>'
        +'<div class="cc-w"><canvas id="'+cid+'"></canvas></div>';
      col.appendChild(div);
      CH[cid]=mkLine(cid,range.labels,kpi.l,vals,dept.color,kpi.u);
    });
  }
}

// ═══════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════
function buildRange(did){
  var labels=[],dkeys=[];
  var cy=drF.y,cm=drF.m;
  while(cy<drT.y||(cy===drT.y&&cm<=drT.m)){
    labels.push(MN[cm]+' '+cy);
    dkeys.push({dept:did,y:cy,m:cm});
    cm++;if(cm>11){cm=0;cy++;}if(labels.length>60)break;
  }
  return{labels:labels,dkeys:dkeys};
}
function rangeLabel(range){
  if(!range.labels.length)return'';
  return range.labels[0]+(range.labels.length>1?' → '+range.labels[range.labels.length-1]:'');
}
function getGSValByKey(dept,dkey,colKey){
  return getGSVal(dept,dkey.y,dkey.m,colKey);
}
function killCharts(pfx){
  Object.keys(CH).filter(function(k){return k.indexOf(pfx)===0;})
    .forEach(function(k){try{CH[k].destroy();}catch(e){}delete CH[k];});
}
function fmtV(v,k){
  if(v==null)return'—';
  if(k.t==='c')return'$'+Number(v).toLocaleString();
  if(k.t==='p')return Number(v).toFixed(1)+(k.u==='%'?'%':'');
  return String(Math.round(v));
}
function mkLine(id,labels,label,data,color,unit){
  var many=labels.length>24;
  return new Chart(document.getElementById(id),{
    type:'line',
    data:{labels:labels,datasets:[{label:label,data:data,borderColor:color,
      backgroundColor:color+'14',tension:.3,fill:true,
      pointRadius:many?2:4,pointBackgroundColor:color,spanGaps:true}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        y:{beginAtZero:unit!=='%',grid:{color:'rgba(0,0,0,.05)'},
           ticks:{font:{size:10},callback:function(v){
             if(unit==='%')return v+'%';
             if(unit==='USD')return v>=1e6?(v/1e6).toFixed(1)+'M':v>=1000?(v/1000).toFixed(0)+'k':'$'+v;
             return v;
           }}},
        x:{grid:{display:false},ticks:{font:{size:10},maxRotation:45,
           autoSkip:true,maxTicksLimit:many?10:labels.length}}
      }
    }
  });
}

// ═══════════════════════════════════════════
// EVENT DELEGATION — no inline handlers
// ═══════════════════════════════════════════
document.addEventListener('DOMContentLoaded',function(){
  el('btn-login').addEventListener('click',doLogin);
  el('btn-logout').addEventListener('click',doLogout);
  el('l-p').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
  el('l-u').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
  el('sync-badge').addEventListener('click',function(){
    if(!U)return;
    setSyncBadge('loading','Syncing…');
    fetchSheetData(function(){
      if(U.role==='bod'){buildBodLeft();renderBodRight(accOpen);}
      else{buildDeptLeft();renderDeptRight();}
    });
  });

  el('lp-body').addEventListener('click',function(e){
    var t=e.target;
    var ah=t.closest('.acc-h');if(ah){toggleAcc(ah.dataset.dept);return;}
    if(t.classList.contains('vc-btn')&&t.dataset.dept){BodViewDept(t.dataset.dept);return;}
    if(t.closest('#sv-btn')){saveDept();return;}
    if(t.dataset.quick){setQ(t.dataset.quick);return;}
    if(t.id==='dr-apply-d'||t.id==='dr-apply-b'){applyDR();return;}
  });
  el('lp-body').addEventListener('change',function(e){
    var t=e.target;
    if(t.id==='s-m'||t.id==='s-y'){onPC();return;}
  });
  el('rp-body').addEventListener('click',function(e){
    var t=e.target;
    if(t.classList.contains('vc-btn')&&t.dataset.dept){BodViewDept(t.dataset.dept);return;}
  });
});
</script>
</body>
