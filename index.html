<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMI · KPI Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f3ef;--sf:#fff;--sf2:#eeede8;--sf3:#e5e4de;
  --bd:#dddcd5;--bd2:#c8c7bf;
  --tx:#1a1a17;--mu:#68675f;--hi:#a0a099;
  --bl:#1255a0;--bl-bg:#e7f0fb;--bl-lt:#c4d8f4;
  --gn:#0b6b4e;--gn-bg:#dff3ec;
  --am:#7a4a08;--am-bg:#faebd5;
  --rd:#9c2828;--rd-bg:#fbe9e9;
  --lw:285px;--th:46px;--r:7px;--rl:11px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:13px;background:var(--bg);color:var(--tx);min-height:100vh;overflow:hidden}
input,button,select,textarea{font-family:inherit;font-size:13px}
button{cursor:pointer}
.hidden{display:none!important}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}

/* LOGIN */
#pg-login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.lcard{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);padding:36px;width:340px}
.lbrand{font-size:22px;font-weight:700;margin-bottom:3px}
.lsub{color:var(--mu);font-size:12px;margin-bottom:26px}
.lf{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.lf label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--mu)}
.lf input{padding:9px 11px;border:1px solid var(--bd);border-radius:var(--r);background:var(--sf);color:var(--tx);font-size:14px}
#btn-login{width:100%;padding:10px;background:var(--bl);color:#fff;border:none;border-radius:var(--r);font-size:14px;font-weight:600;margin-top:4px}
#l-err{color:var(--rd);font-size:12px;margin-top:8px;padding:7px 10px;background:var(--rd-bg);border-radius:var(--r);display:none}

/* TOPBAR */
.topbar{height:var(--th);background:var(--sf);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:fixed;top:0;left:0;right:0;z-index:100}
.tlogo{font-weight:700;font-size:14px}.tlogo span{color:var(--mu);font-weight:400}
.tright{display:flex;align-items:center;gap:10px}
.tbadge{font-size:11px;font-weight:600;padding:2px 9px;border-radius:12px}
.tba{background:var(--bl-bg);color:var(--bl)}.tbm{background:var(--am-bg);color:var(--am)}
.tav{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
#btn-logout{padding:5px 11px;border-radius:var(--r);border:1px solid var(--bd2);background:transparent;color:var(--mu);font-size:11px}
.sync-badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;opacity:0.6;cursor:pointer}
.sync-ok{background:var(--gn-bg);color:var(--gn)}.sync-loading{background:var(--am-bg);color:var(--am)}.sync-err{background:var(--rd-bg);color:var(--rd)}

/* SHELL */
#pg-app{display:none;flex-direction:column}
.shell{display:flex;height:calc(100vh - var(--th));margin-top:var(--th)}
.lp{width:var(--lw);flex-shrink:0;background:var(--sf);border-right:1px solid var(--bd);overflow:hidden;display:flex;flex-direction:column}
.lp-sc{flex:1;overflow-y:auto;padding:14px 13px}
.rp{flex:1;overflow-y:auto;padding:18px 20px;background:var(--bg)}
.lsec{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--hi);margin:14px 0 7px}

/* ACCORDION (SIDEBAR) */
.acc{border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;margin-bottom:6px}
.acc-h{display:flex;align-items:center;gap:7px;padding:9px 10px;cursor:pointer;user-select:none}
.acc-h:hover,.acc-h.open{background:var(--bl-bg)}
.ah-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ah-name{flex:1;font-weight:600;font-size:12px;display:flex;justify-content:space-between;align-items:center}
.ah-last{font-size:9px;font-weight:400;color:var(--hi);background:var(--sf2);padding:1px 5px;border-radius:4px}
.ah-st{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.st-ok{background:#1D9E75}.st-pend{background:#EF9F27}
.ah-ch{font-size:9px;color:var(--hi);transition:transform .2s}.ah-ch.open{transform:rotate(90deg)}
.acc-b{display:none;border-top:1px solid var(--bd);background:var(--sf2);padding:10px 11px}.acc-b.open{display:block}

.ks-row{display:flex;align-items:baseline;padding:4px 0;border-bottom:1px solid var(--bd);gap:5px}
.ks-l{font-size:11px;color:var(--mu);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ks-v{font-size:12px;font-weight:600}
.ks-d{font-size:10px;font-weight:700}
.du{color:var(--gn)}.dd{color:var(--rd)}.dn{color:var(--hi)}
.vc-btn{width:100%;margin-top:8px;padding:6px;border-radius:var(--r);border:1px solid var(--bl-lt);background:var(--bl-bg);color:var(--bl);font-size:11px;font-weight:600;cursor:pointer}

/* CHARTS */
.rp-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px}
.btn-back{padding:5px 12px;background:var(--sf);border:1px solid var(--rd);color:var(--rd);border-radius:var(--r);font-size:11px;font-weight:700;cursor:pointer}
.rp-title{font-size:17px;font-weight:700}.rp-sub{font-size:12px;color:var(--mu)}
.charts-col{display:flex;flex-direction:column;gap:14px}
.cc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);padding:16px 18px}
.cc-t{font-size:13px;font-weight:700;margin-bottom:2px}.cc-s{font-size:11px;color:var(--mu);margin-bottom:12px}
.cc-w{position:relative;height:185px}.cc-w.tall{height:220px}

/* HELPERS */
.dr-box{background:var(--sf2);border:1px solid var(--bd);border-radius:var(--r);padding:10px 11px;margin-bottom:10px}
.dr-row{display:flex;gap:5px;align-items:center;margin-bottom:6px}
.drsel{flex:1;padding:5px 7px;border:1px solid var(--bd);border-radius:var(--r);font-size:11px}
.dr-apply{width:100%;padding:6px;border:none;border-radius:var(--r);background:var(--bl);color:#fff;font-size:11px;font-weight:600}
.stbl-w{background:var(--sf);border:1px solid var(--bd);border-radius:var(--rl);overflow:hidden;margin-bottom:14px}
table{width:100%;border-collapse:collapse}
thead th{padding:8px 14px;text-align:left;font-size:10px;font-weight:700;color:var(--mu);text-transform:uppercase;border-bottom:1px solid var(--bd)}
tbody td{padding:9px 14px;font-size:12px;border-bottom:1px solid var(--bd)}
.badge{display:inline-flex;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.bg{background:var(--gn-bg);color:var(--gn)}.ba{background:var(--am-bg);color:var(--am)}
#g-loader{position:fixed;inset:0;background:rgba(244,243,239,.85);display:flex;align-items:center;justify-content:center;z-index:999;flex-direction:column}
.gl-spin{width:26px;height:26px;border:3px solid var(--bd);border-top-color:var(--bl);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="g-loader" class="hidden"><div class="gl-spin"></div><div class="gl-lbl">Loading…</div></div>

<div id="pg-login">
  <div class="lcard">
    <div class="lbrand">CMI Operations</div>
    <div class="lsub">KPI Reporting System</div>
    <div class="lf"><label>Username</label><input id="l-u" type="text" autocomplete="off"></div>
    <div class="lf"><label>Password</label><input id="l-p" type="password"></div>
    <div id="l-err"></div>
    <button id="btn-login">Sign in</button>
  </div>
</div>

<div id="pg-app">
  <div class="topbar">
    <div class="tlogo">CMI <span>· KPI Dashboard</span></div>
    <div class="tright">
      <span id="sync-badge" class="sync-badge sync-loading">Syncing…</span>
      <span id="t-badge" class="tbadge"></span>
      <span id="t-name" style="font-size:12px;color:var(--mu);margin-right:5px"></span>
      <div id="t-av" class="tav"></div>
      <button id="btn-logout" style="margin-left:10px">Sign out</button>
    </div>
  </div>
  <div class="shell">
    <div class="lp"><div class="lp-sc" id="lp-body"></div></div>
    <div class="rp">
      <div class="rp-header">
        <div><div id="rp-title" class="rp-title">Dashboard</div><div id="rp-sub" class="rp-sub">Summary</div></div>
        <button id="btn-back-overview" class="btn-back hidden">BACK TO OVERVIEW</button>
      </div>
      <div id="rp-body"></div>
    </div>
  </div>
</div>

<script>
var SHEET_ID = '1erlvjOnrRT90VMnCkNnqOU-xORkYidNqwAyxcWBjsVk', SHEET_GID = '0';
var SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${SHEET_GID}`;
var MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var NY = new Date().getFullYear(), NM = new Date().getMonth();
var GS_DATA = [], GS_HDR = [], U=null, deptId=null, selY=NY, selM=NM;
var drF={y:NY-1,m:0}, drT={y:NY,m:NM}, accOpen=null, CH={};

var DEPTS = [
  {id:'PROD',  name:'Production', color:'#378ADD', ini:'PR', mgr:'Production Manager',
   kpis:[{k:'Plan_Boats',l:'Plan Boats',u:'count',t:'i'},{k:'Actual_Boats',l:'Actual Boats',u:'count',t:'i'},{k:'OnTime_pct',l:'On-Time %',u:'%',t:'p'},{k:'Hours_Planned',l:'Hours Planned',u:'hrs',t:'i'},{k:'Hours_Actual',l:'Hours Actual',u:'hrs',t:'i'}],
   overlayCharts:[{title:'Boats: Plan vs Actual',datasets:[{key:'Plan_Boats',label:'Plan',color:'#93C5FD',type:'bar'},{key:'Actual_Boats',label:'Actual',color:'#1D4ED8',type:'bar'}]}]},
  {id:'SALES', name:'Sales', color:'#1D9E75', ini:'SA', mgr:'Sales Manager',
   kpis:[{k:'Orders_Booked_USD',l:'Orders Booked',u:'USD',t:'c'},{k:'Target_USD',l:'Target',u:'USD',t:'c'}],
   overlayCharts:[{title:'Sales vs Target',datasets:[{key:'Target_USD',label:'Target',color:'#A7F3D0',type:'bar'},{key:'Orders_Booked_USD',label:'Actual',color:'#059669',type:'bar'}]}]},
  {id:'QA',    name:'Quality Assurance', color:'#D4537E', ini:'QA', mgr:'QA Manager', kpis:[{k:'FirstTimePass_pct',l:'First Pass',u:'%',t:'p'},{k:'Factory_Defects_pct',l:'Defects',u:'%',t:'p'}]},
  {id:'FIN',   name:'Finance', color:'#EF9F27', ini:'FN', mgr:'FN Manager', kpis:[{k:'Revenue_USD',l:'Revenue',u:'USD',t:'c'},{k:'Cash_Balance_USD',l:'Cash',u:'USD',t:'c'}]},
  {id:'SCM',   name:'Supply Chain', color:'#D85A30', ini:'SC', mgr:'SC Manager', kpis:[{k:'OTIF_Customer_pct',l:'OTIF',u:'%',t:'p'}]},
  {id:'HR',    name:'Human Resources', color:'#7F77DD', ini:'HR', mgr:'HR Manager', kpis:[{k:'Headcount',l:'Headcount',u:'ppl',t:'i'},{k:'Turnover_pct',l:'Turnover',u:'%',t:'p'}]},
  {id:'CS',    name:'Customer Service', color:'#0891B2', ini:'CS', mgr:'CS Manager', kpis:[{k:'Customer_Sat_pct',l:'Sat %',u:'%',t:'p'}]},
  {id:'IT',    name:'IT', color:'#475569', ini:'IT', mgr:'IT Manager', kpis:[{k:'Uptime_pct',l:'Uptime',u:'%',t:'p'}]},
  {id:'TL',    name:'TL Handover', color:'#F97316', ini:'TL', mgr:'TL Manager', kpis:[{k:'Handover_OnTime_pct',l:'On-Time',u:'%',t:'p'}]}
];

var USERS = {
  bod:        {role:'bod', name:'Managing Director', ini:'MD', color:'#EF9F27', pass:'bod123'},
  production: {role:'dept', dept:'PROD',   name:'Production', ini:'RK', color:'#378ADD', pass:'production123'},
  sales:      {role:'dept', dept:'SALES',  name:'Sales',      ini:'MS', color:'#1D9E75', pass:'sales123'},
  qa:         {role:'dept', dept:'QA',     name:'QA',         ini:'DA', color:'#D4537E', pass:'qa123'},
  finance:    {role:'dept', dept:'FIN',    name:'Finance',    ini:'PD', color:'#EF9F27', pass:'finance123'},
  supply:     {role:'dept', dept:'SCM',    name:'Supply',     ini:'LT', color:'#D85A30', pass:'supply123'},
  hr:         {role:'dept', dept:'HR',     name:'HR',         ini:'MC', color:'#7F77DD', pass:'hr123'},
  cs:         {role:'dept', dept:'CS',     name:'CS',         ini:'VN', color:'#0891B2', pass:'cs123'},
  design:     {role:'dept', dept:'DESIGN', name:'Design',     ini:'JM', color:'#8B5CF6', pass:'design123'},
  it:         {role:'dept', dept:'IT',     name:'IT',         ini:'IT', color:'#475569', pass:'it123'},
  marketing:  {role:'dept', dept:'MKTG',   name:'Marketing',  ini:'NP', color:'#EC4899', pass:'marketing123'},
  project_dev:{role:'dept', dept:'PD',     name:'Project',    ini:'PL', color:'#14B8A6', pass:'project_dev123'},
  property:   {role:'dept', dept:'PROP',   name:'Property',   ini:'PM', color:'#84CC16', pass:'property123'},
  tl_handover:{role:'dept', dept:'TL',     name:'Thailand',   ini:'PH', color:'#F97316', pass:'tl_handover123'},
  cid:        {role:'dept', dept:'CID',    name:'CID',        ini:'CI', color:'#6366F1', pass:'cid123'}
};

function el(id){return document.getElementById(id);}

function parseCSV(text) {
  var rows = [], cur = [], field = '', inQ = false;
  for (var i = 0; i < text.length; i++) {
    var ch = text[i];
    if (inQ) { if (ch === '"' && text[i + 1] === '"') { field += '"'; i++; } else if (ch === '"') inQ = false; else field += ch; }
    else { if (ch === '"') inQ = true; else if (ch === ',') { cur.push(field); field = ''; } else if (ch === '\n' || (ch === '\r' && text[i + 1] === '\n')) { if (ch === '\r') i++; cur.push(field); field = ''; rows.push(cur); cur = []; } else field += ch; }
  }
  if (field || cur.length) cur.push(field); 
  return rows.filter(r => r.length > 1 && r[0]); 
}

function fetchSheetData(cb){
  el('g-loader').classList.remove('hidden');
  fetch(SHEET_URL+'&t='+Date.now())
    .then(r => r.text())
    .then(csv => {
      GS_DATA = parseCSV(csv);
      if(GS_DATA.length > 0) {
        GS_HDR = GS_DATA[0].map(h => h.trim());
        GS_DATA = GS_DATA.slice(1);
        el('sync-badge').textContent = 'Live · ' + GS_DATA.length + ' rows'; 
        el('sync-badge').className='sync-badge sync-ok';
      }
      el('g-loader').classList.add('hidden'); 
      if(cb)cb();
    })
    .catch(e => { 
      el('g-loader').classList.add('hidden'); 
      el('sync-badge').textContent = 'Offline'; 
      el('sync-badge').className='sync-badge sync-err';
      if(cb)cb(); 
    });
}

function getLatestRecordInfo(did) {
  var rows = GS_DATA.filter(r => r[0] === did);
  if (!rows.length) return null;
  var last = rows[rows.length - 1];
  var prev = rows.length > 1 ? rows[rows.length - 2] : null;
  return { last, prev, m: parseInt(last[1]), y: parseInt(last[2]) };
}

function getGSVal(dept, y, m, k){
  var ki = GS_HDR.indexOf(k); if(ki<0) return null;
  var r = GS_DATA.find(r=>r[0]===dept && parseInt(r[1])===(m) && parseInt(r[2])===(y));
  return r && r[ki] ? parseFloat(r[ki]) : null;
}

function doLogin(){
  var u=el('l-u').value.trim().toLowerCase(), p=el('l-p').value, acc=USERS[u];
  if(!acc || acc.pass!==p) { 
    el('l-err').textContent='Wrong username/password'; 
    el('l-err').style.display='block'; 
    return; 
  }
  U=acc; 
  el('pg-login').style.display='none'; 
  el('pg-app').style.display='flex';
  el('t-av').textContent=U.ini; 
  el('t-av').style.background=U.color+'25'; 
  el('t-name').textContent=U.name;
  
  fetchSheetData(() => { 
    if(U.role==='bod') { 
      buildBodLeft(); 
      renderBodRight(null); 
    } else { 
      deptId=U.dept; 
      renderDeptView(); 
    } 
  });
}

function renderDeptView() {
  var d = DEPTS.find(x => x.id === deptId);
  el('rp-title').textContent = d.name;
  el('rp-sub').textContent = 'Department Entry';
  
  var info = getLatestRecordInfo(deptId);
  var html = `<div class="lsec">KPI Management</div><div class="dr-box">`;
  html += `<p style="font-size:12px; margin-bottom:10px">Latest Update: <b>${info ? MN[info.m-1] + ' ' + info.y : 'None'}</b></p>`;
  html += `</div><div class="charts-col" id="d-col"></div>`;
  el('rp-body').innerHTML = html;
  
  if(d.overlayCharts) d.overlayCharts.forEach((oc,i) => renderOverlayChart(`d_oc_${i}`, d, oc, 'd-col'));
  else d.kpis.forEach((k,i) => renderSingleChart(`d_${i}`, d, k, 'd-col'));
}

function buildBodLeft(){
  var html = `<div class="lsec">Chart Range</div><div class="dr-box">
    <div class="dr-row"><label>From</label><select class="drsel" id="bdf-m">${MN.map((m,i)=>`<option value="${i}" ${i===drF.m?'selected':''}>${m}</option>`).join('')}</select><select class="drsel" id="bdf-y">${[2024,2025,2026].map(y=>`<option value="${y}" ${y===drF.y?'selected':''}>${y}</option>`).join('')}</select></div>
    <div class="dr-row"><label>To</label><select class="drsel" id="bdt-m">${MN.map((m,i)=>`<option value="${i}" ${i===drT.m?'selected':''}>${m}</option>`).join('')}</select><select class="drsel" id="bdt-y">${[2024,2025,2026].map(y=>`<option value="${y}" ${y===drT.y?'selected':''}>${y}</option>`).join('')}</select></div>
    <button class="dr-apply" onclick="applyBodRange()">Apply Range</button></div><div class="lsec">Departments</div>`;
  
  DEPTS.forEach(d=>{
    var info = getLatestRecordInfo(d.id);
    var has = !!info, open = accOpen===d.id;
    html += `<div class="acc" id="acc-${d.id}">
      <div class="acc-h ${open?'open':''}" onclick="toggleAcc('${d.id}')">
        <span class="ah-dot" style="background:${d.color}"></span>
        <span class="ah-name">${d.name} <span class="ah-last">${has ? MN[info.m-1] + ' ' + info.y : 'No data'}</span></span>
        <span class="ah-st ${has?'st-ok':'st-pend'}"></span>
        <span class="ah-ch ${open?'open':''}">▶</span>
      </div>
      <div class="acc-b ${open?'open':''}" id="ab-${d.id}">${buildAccBody(d, info)}</div>
    </div>`;
  });
  el('lp-body').innerHTML = html;
}

function buildAccBody(dept, info){
  if (!info) return '<div style="padding:10px;color:var(--hi)">No data submitted yet.</div>';
  var kiAt = (row, key) => {
    var idx = GS_HDR.indexOf(key);
    return (idx >= 0 && row[idx]) ? parseFloat(row[idx]) : null;
  };
  var rows = dept.kpis.map(k => {
    var v = kiAt(info.last, k.k);
    var pv = info.prev ? kiAt(info.prev, k.k) : null;
    var diff = '', cls = 'dn';
    if (v != null && pv != null && pv !== 0) {
      var p = ((v - pv) / Math.abs(pv) * 100).toFixed(1);
      diff = (p >= 0 ? '▲' : '▼') + Math.abs(p) + '%';
      cls = p >= 0 ? 'du' : 'dd';
    }
    return `<div class="ks-row">
      <span class="ks-l">${k.l}</span>
      <span class="ks-v" style="color:${dept.color}">${fmtV(v, k)}</span>
      ${diff ? `<span class="ks-d ${cls}">${diff}</span>` : ''}
    </div>`;
  }).join('');
  return `<div>${rows}</div><button class="vc-btn" onclick="renderBodRight('${dept.id}')">View detailed charts →</button>`;
}

function toggleAcc(id){ accOpen = (accOpen === id ? null : id); buildBodLeft(); if(accOpen) renderBodRight(accOpen); }
function applyBodRange(){ drF={m:parseInt(el('bdf-m').value), y:parseInt(el('bdf-y').value)}; drT={m:parseInt(el('bdt-m').value), y:parseInt(el('bdt-y').value)}; renderBodRight(accOpen); }

function renderBodRight(id){
  killCharts('b_'); var body=el('rp-body');
  if(!id){
    el('btn-back-overview').classList.add('hidden'); el('rp-title').textContent='CMI Overview'; el('rp-sub').textContent='Consolidated performance';
    var tRows = DEPTS.map(d=>{
      var info = getLatestRecordInfo(d.id);
      return `<tr><td>${d.name}</td><td>${d.mgr}</td><td><span class="badge ${info?'bg':'ba'}">${info?'Active':'Pending'}</span></td><td><button class="vc-btn" style="margin:0" onclick="toggleAcc('${d.id}')">View</button></td></tr>`;
    }).join('');
    var chartsHtml = DEPTS.map(d=>`<div class="cc"><div class="cc-t">${d.name} Trend</div><div class="cc-w"><canvas id="b_ov_${d.id}"></canvas></div></div>`).join('');
    body.innerHTML = `<div class="stbl-w"><table><thead><tr><th>Dept</th><th>Manager</th><th>Status</th><th>Action</th></tr></thead><tbody>${tRows}</tbody></table></div><div class="charts-col">${chartsHtml}</div>`;
    DEPTS.forEach(d=>renderOverviewChart(`b_ov_${d.id}`, d));
    return;
  }
  el('btn-back-overview').classList.remove('hidden');
  var d=DEPTS.find(x=>x.id===id); el('rp-title').textContent=d.name; el('rp-sub').textContent=d.mgr; body.innerHTML='<div class="charts-col" id="b-col"></div>';
  if(d.overlayCharts) d.overlayCharts.forEach((oc,i)=>renderOverlayChart(`b_oc_${i}`, d, oc, 'b-col'));
  else d.kpis.forEach((k,i)=>renderSingleChart(`b_${i}`, d, k, 'b-col'));
}

function renderOverviewChart(cid, dept){
  var range = buildRange();
  if(dept.overlayCharts) {
    var oc = dept.overlayCharts[0];
    var ds = oc.datasets.map(ds=>({label:ds.label, data:range.dkeys.map(dk=>getGSVal(dept.id,dk.y,dk.m+1,ds.key)), borderColor:ds.color, backgroundColor:ds.color+'55', type:ds.type, tension:0.3, fill:true, spanGaps:true}));
    CH[cid] = new Chart(el(cid),{data:{labels:range.labels, datasets:ds}, options:getOpts()});
  } else {
    var k = dept.kpis[0];
    var vals = range.dkeys.map(dk=>getGSVal(dept.id,dk.y,dk.m+1,k.k));
    CH[cid] = new Chart(el(cid),{type:'line', data:{labels:range.labels, datasets:[{label:k.l, data:vals, borderColor:dept.color, tension:0.3, fill:true, spanGaps:true}]}, options:getOpts()});
  }
}

function renderOverlayChart(cid, dept, oc, containerId){
  var range=buildRange(), div=document.createElement('div'); div.className='cc';
  div.innerHTML=`<div class="cc-t">${oc.title}</div><div class="cc-w tall"><canvas id="${cid}"></canvas></div>`;
  el(containerId).appendChild(div);
  var ds = oc.datasets.map(d=>({label:d.label, data:range.dkeys.map(dk=>getGSVal(dept.id,dk.y,dk.m+1,d.key)), borderColor:d.color, backgroundColor:d.color+'55', type:d.type, tension:0.3, fill:true, spanGaps:true}));
  CH[cid] = new Chart(el(cid),{data:{labels:range.labels, datasets:ds}, options:getOpts()});
}

function renderSingleChart(cid, dept, k, containerId){
  var range=buildRange(), div=document.createElement('div'); div.className='cc';
  div.innerHTML=`<div class="cc-t">${k.l}</div><div class="cc-w"><canvas id="${cid}"></canvas></div>`;
  el(containerId).appendChild(div);
  var vals = range.dkeys.map(dk=>getGSVal(dept.id,dk.y,dk.m+1,k.k));
  CH[cid] = new Chart(el(cid),{type:'line', data:{labels:range.labels, datasets:[{label:k.l, data:vals, borderColor:dept.color, tension:0.3, fill:true, spanGaps:true}]}, options:getOpts()});
}

function getOpts(){
  return { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:true,labels:{boxWidth:12,font:{size:10}}}}, 
    scales:{y:{ticks:{callback:v=>v.toLocaleString(undefined,{maximumFractionDigits:1})}}, x:{ticks:{font:{size:9}}}} 
  };
}

function buildRange(){
  var labels=[], dkeys=[], cy=drF.y, cm=drF.m;
  while(cy<drT.y || (cy===drT.y && cm<=drT.m)){ labels.push(MN[cm]+' '+cy); dkeys.push({y:cy,m:cm}); cm++; if(cm>11){cm=0;cy++;} }
  return {labels, dkeys};
}

function killCharts(pfx){ Object.keys(CH).forEach(k=>{ if(k.startsWith(pfx)){CH[k].destroy(); delete CH[k];} }); }
function fmtV(v,k){ if(v==null)return'—'; if(k.t==='c')return '$'+v.toLocaleString(); return v.toLocaleString(undefined,{maximumFractionDigits:1})+(k.u==='%'?'%':''); }

el('btn-login').onclick = doLogin;
el('btn-logout').onclick = () => location.reload();
el('btn-back-overview').onclick = () => { accOpen=null; renderBodRight(null); buildBodLeft(); };
</script>
</body>
